[default]
extend-ignore-re = ["^flake/dev/checks/default\\.nix$"]

[files]
extend-exclude = [
  "modules/home/programs/terminal/tools/pi/vendor/**",
  # Vendored upstream theme assets contain file-type icon identifiers
  # (styl, odf, cpy, edn, ...) that are not spelling errors.
  "modules/home/programs/terminal/tools/yazi/flavors/**",
  "modules/home/programs/terminal/tools/yazi/official/**",
  "modules/home/programs/terminal/tools/zellij/themes/**",
  "modules/home/programs/terminal/emulators/ghostty/themes/**",
]

[default.extend-words]
ags = "ags"
ba = "ba"
Folx = "Folx"
folx = "folx"
iterm = "iterm"
metaphore = "metaphore"
som = "som"
SOM = "SOM"
Collison = "Collison"
nd = "nd"
hace = "hace"
# Helium browser bundle id (net.imput.helium); upstream typo, not ours.
imput = "imput"
