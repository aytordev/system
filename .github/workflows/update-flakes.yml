name: "Update flakes"
on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
concurrency:
  # A manual dispatch must not race the nightly run over the update-flake-lock
  # branch.
  group: update-flakes
  cancel-in-progress: false
# The repository default for GITHUB_TOKEN is read-only, and the fallback path
# below has to push a branch and open the pull request.
permissions:
  contents: write
  pull-requests: write
jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        if: vars.CI_APP_ID
        # A token request for a permission the App installation does not grant
        # fails with HTTP 422. That must not kill the nightly run: without a
        # token the job falls back to GITHUB_TOKEN and warns below.
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          # Only what this workflow uses. Requesting more than the installation
          # grants is what broke the nightly run.
          permission-contents: write
          permission-pull-requests: write
      - name: Get GitHub App user info
        id: user-info
        if: vars.CI_APP_ID && steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          name="${SLUG}[bot]"
          id=$(gh api "/users/$name" --jq .id)
          {
            echo "id=$id"
            echo "name=$name"
            echo "email=$id+$name@users.noreply.github.com"
          } >> "$GITHUB_OUTPUT"
      - name: Report token mode
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "Using the GitHub App token; the update PR will trigger CI."
          else
            echo "::warning::No GitHub App token available, falling back to GITHUB_TOKEN. The update PR will not trigger CI by itself, and opening it also needs 'Allow GitHub Actions to create and approve pull requests' in the repository Actions settings. Grant the App 'Contents: read and write' and 'Pull requests: read and write' to restore the bot path."
          fi
      - uses: actions/checkout@v7
      - name: Setup Git
        env:
          GIT_USER_NAME: ${{ steps.user-info.outputs.name || 'github-actions[bot]' }}
          GIT_USER_EMAIL: ${{ steps.user-info.outputs.email || '41898282+github-actions[bot]@users.noreply.github.com' }}
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        with:
          extra_nix_config: |
            access-tokens = github.com=${{steps.app-token.outputs.token || github.token}}
      - name: Update flake.lock
        # Every input except the private `secrets` repo, which CI cannot fetch
        # (git+ssh) and must never be auto-bumped. The list is derived from
        # flake.lock rather than hardcoded: the previous hardcoded list had
        # rotted into naming an input that no longer exists, which fails the
        # update outright.
        run: |
          set -euo pipefail
          mapfile -t inputs < <(
            jq -r '
              .nodes.root.inputs
              | to_entries[]
              | select(.value | type == "string")
              | select(.key != "secrets")
              | .key
            ' flake.lock
          )
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "::error::could not derive any updatable input from flake.lock"
            exit 1
          fi
          printf 'Updating: %s\n' "${inputs[*]}"
          nix flake update "${inputs[@]}"
      - name: Update dev flake.lock
        # `root` must be in the list: the dev partition's nixpkgs follows
        # root/nixpkgs, so only re-locking `root` moves the follower. Inputs
        # that follow another flake are stored as paths in the lock and are
        # skipped by the `type == "string"` filter.
        run: |
          set -euo pipefail
          mapfile -t inputs < <(
            jq -r '
              .nodes.root.inputs
              | to_entries[]
              | select(.value | type == "string")
              | .key
            ' flake/dev/flake.lock
          )
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "::error::could not derive any updatable input from flake/dev/flake.lock"
            exit 1
          fi
          printf 'Updating dev inputs: %s\n' "${inputs[*]}"
          # The `./` prefix is required: a bare relative path is read as a flake
          # registry reference and fails with "cannot find flake
          # 'flake:flake/dev'".
          nix flake update --flake ./flake/dev "${inputs[@]}"
      - name: Check for nixpkgs updates
        id: check-nixpkgs
        run: |
          if git diff flake.lock flake/dev/flake.lock | grep -E '"nixpkgs":|"nixpkgs-unstable":'; then
            echo "nixpkgs_updated=true" >> "$GITHUB_OUTPUT"
            echo "✓ nixpkgs or nixpkgs-unstable was updated"
          else
            echo "nixpkgs_updated=false" >> "$GITHUB_OUTPUT"
            echo "✗ nixpkgs inputs were not updated, skipping PR"
          fi
      - name: Commit changes
        if: steps.check-nixpkgs.outputs.nixpkgs_updated == 'true'
        run: |
          git add flake.lock flake/dev/flake.lock
          git commit -m "flake.lock: update"
      - name: Create Pull Request
        if: steps.check-nixpkgs.outputs.nixpkgs_updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          branch: update-flake-lock
          delete-branch: true
          title: "chore(flake): lock update"
          body: |
            Automated update by the update-flake-lock workflow.

            This PR updates nixpkgs inputs.

            This PR was created by workflow run [${{ github.run_id }}].

            [${{ github.run_id }}]: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          committer: ${{ steps.user-info.outputs.name || 'github-actions[bot]' }} <${{ steps.user-info.outputs.email || '41898282+github-actions[bot]@users.noreply.github.com' }}>
          author: ${{ steps.user-info.outputs.name || 'github-actions[bot]' }} <${{ steps.user-info.outputs.email || '41898282+github-actions[bot]@users.noreply.github.com' }}>
